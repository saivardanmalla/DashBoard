version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: nexus_mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secretpassword
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nexus_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:secretpassword@mongodb:27017/nexus_collab?authSource=admin
      JWT_ACCESS_SECRET: your_super_secure_access_secret_key_123
      JWT_REFRESH_SECRET: your_super_secure_refresh_secret_key_456
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-dummy-key}
      CLIENT_URL: http://localhost:3000
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: nexus_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
